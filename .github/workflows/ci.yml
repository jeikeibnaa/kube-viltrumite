# Runs the same gates as a session's end-of-session checklist, plus the image
# build and the kind smoke test that need Docker.
#
# Third-party actions are pinned to commit SHAs (the comment names the release).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The tag config/default deploys and hack/e2e.sh loads into kind.
  IMG: ghcr.io/jeikeibnaa/kube-viltrumite:dev

jobs:
  verify:
    name: Vet, test, build, generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make verify
        run: make verify
      - name: Generated code is committed
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the result."
            git status --short
            git diff
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0
      - name: shellcheck (preinstalled on ubuntu runners)
        run: shellcheck hack/*.sh

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same major as the Dockerfile's UI stage (node:22-alpine).
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: make ui
        run: make ui

  image:
    name: Operator image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: e2e (kind)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image into the local Docker (from the image job's cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          # A plain image: attestation manifests make `kind load docker-image`
          # fail on Docker's containerd image store ("content digest not found").
          provenance: false
          sbom: false
          tags: ${{ env.IMG }}
          cache-from: type=gha
      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # hack/e2e.sh creates and deletes its own cluster, as `make e2e` does locally.
          install_only: true
      - name: make e2e
        run: make e2e
        env:
          E2E_SKIP_BUILD: "1"
