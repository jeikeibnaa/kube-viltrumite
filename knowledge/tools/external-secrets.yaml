# Knowledge base entry for External Secrets Operator.
#
# Schema v2 (planner.Load rejects a file that breaks it; see internal/planner/matrix.go):
#   tool: string                 — canonical tool name (lowercase letters, digits, '-'); file is <tool>.yaml
#   aliases: [string]            — optional; other names scanners report for this tool, such as
#                                  Helm chart names. A name belongs to one tool only.
#   alias_origins:               — optional; for an alias too generic to trust alone: words, one of
#     <alias>: [string]            which the chart's origin (Helm home/sources, Argo CD repoURL, Flux
#                                  source name) must contain for the alias to count
#   detection:                   — optional; how to find a raw `kubectl apply` install
#     deployments[]:             — a Deployment, StatefulSet or DaemonSet matches by name or image
#       name: string             — workload name
#       image: string            — image repository, matched as a whole path suffix ("istio/pilot")
#       container: string        — container to read the version from after a name-only match
#       namespace_hint: string   — namespace the tool usually runs in (informational)
#       version_from: string     — image_tag | label (app.kubernetes.io/version)
#     labels: {string: string}
#   versions[]:                  — ascending by app_version, no duplicates
#     app_version: string        — upstream app version, full semver without "v" ("1.14.0"): the minor's
#                                  first release, or the patch upstream says to install instead.
#                                  The entry also covers later patches of its minor, up to the next entry.
#     chart_version: string      — Helm chart version that ships app_version, as published; ascending
#     source: string             — upstream release notes or upgrade guide the entry is based on
#     min_kubernetes: string     — earliest Kubernetes minor upstream supports or tests this version on,
#                                  never below the Helm chart's kubeVersion floor
#     incompatible_with:         — optional; tool name or alias → app versions of that tool known to
#       <tool>: [string]           break with this version, only with an upstream source
#     breaking_changes[]:        — changes since the previous entry that need attention; may be empty
#       description: string      — human-readable summary
#       type: string             — api_removal | crd_migration | config_change | behaviour_change
#     risk_level: string         — risk of upgrading to this version: low (nothing to do for a default
#                                  install) | medium (a documented step or config review for some
#                                  installs) | high (running workloads, traffic, keys or stored objects
#                                  break if the steps are missed) | blocking (do not install)
#     upgrade_notes: string      — operator guidance for the upgrade from the previous entry
#
# One entry per minor, verified 2026-09-30 against the GitHub release notes and the stability and support
# page (https://external-secrets.io/latest/introduction/stability-support/), and the chart index
# https://charts.external-secrets.io. The chart's kubeVersion is ">= 1.19.0-0" for every release;
# min_kubernetes is the lowest Kubernetes version on the support page (a range up to 0.13, the
# versions the test suite runs from 0.14). Upstream supports only the latest minor and recommends
# upgrading one minor at a time. 0.9.5 and 0.10.5 are extra patch entries on their minors.

tool: external-secrets

detection:
  deployments:
    - name: external-secrets
      namespace_hint: external-secrets
      container: external-secrets
      image: external-secrets/external-secrets
      version_from: image_tag

versions:
  - app_version: "0.8.0"
    chart_version: "0.8.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.8.0"
    min_kubernetes: "1.19"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. Adds deletion policies, the Vault dynamic secret
      generator and the PushSecret CRD in the kustomize bundle.

  - app_version: "0.9.0"
    chart_version: "0.9.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.9.0"
    min_kubernetes: "1.19"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. The webhook can use certificates managed by
      cert-manager (#2394).

  - app_version: "0.9.5"
    chart_version: "0.9.5"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.9.5"
    min_kubernetes: "1.19"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      Patch release on 0.9 with no breaking change; metrics of deleted resources are removed.

  - app_version: "0.10.0"
    chart_version: "0.10.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.10.0"
    min_kubernetes: "1.19"
    breaking_changes:
      - description: >
          The webhook provider only reads Secrets labelled external-secrets.io/type: webhook
        type: behaviour_change
      - description: >
          The webhook generator label changes from generators.external-secrets.io/type: webhook to
          external-secrets.io/type: webhook
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Label the Secrets used by webhook providers and generators with
      external-secrets.io/type: webhook before upgrading, or their ExternalSecrets stop syncing.

  - app_version: "0.10.5"
    chart_version: "0.10.5"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.10.5"
    min_kubernetes: "1.19"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "Patch release on 0.10 with no breaking change."

  - app_version: "0.11.0"
    chart_version: "0.11.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.11.0"
    min_kubernetes: "1.19"
    breaking_changes:
      - description: >
          Keys an ExternalSecret created in its target Secret are removed once they leave the
          template or data, even with creationPolicy Merge
        type: behaviour_change
      - description: >
          With creationPolicy Owner the controller computes the whole target Secret and keeps no
          other keys
        type: behaviour_change
      - description: >
          Only managed Secrets are cached by default; memory use can rise if --enable-secrets-caching
          was not set
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      Check ExternalSecrets that share a target Secret with other writers: keys they no longer
      template are deleted. 0.11.0 is the last release published to OLM.

  - app_version: "0.12.1"
    chart_version: "0.12.1"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.12.1"
    min_kubernetes: "1.19"
    breaking_changes:
      - description: >
          The AWS provider bulk-fetches several secrets at once and needs the IAM permission for it
        type: config_change
      - description: >
          The ECR generator's JSON field ecrRAuthorizationTokenSpec is renamed
          ecrAuthorizationTokenSpec
        type: config_change
      - description: >
          GCP Secret Manager PushSecret metadata uses a standardized structure; the old one stops
          working
        type: config_change
    risk_level: medium
    upgrade_notes: >
      0.12.0 failed to release; 0.12.1 is the first 0.12 release. Grant the bulk-fetch permission to
      the AWS role and update GCP PushSecret metadata before upgrading.

  - app_version: "0.13.0"
    chart_version: "0.13.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.13.0"
    min_kubernetes: "1.19"
    breaking_changes:
      - description: >
          AWS Parameter Store PushSecret metadata uses the PushSecretMetadata structure
          (apiVersion kubernetes.external-secrets.io/v1alpha1)
        type: config_change
    risk_level: medium
    upgrade_notes: "Rewrite AWS Parameter Store PushSecret metadata to the new structure before upgrading."

  - app_version: "0.14.0"
    chart_version: "0.14.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.14.0"
    min_kubernetes: "1.32"
    breaking_changes:
      - description: >
          Stateful generators change the ExternalSecret and PushSecret controllers (flagged as
          potentially breaking)
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Watch ExternalSecrets and PushSecrets for sync errors after the upgrade. From 0.14 upstream
      tests only on the Kubernetes version its suite runs (1.32).

  - app_version: "0.15.0"
    chart_version: "0.15.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.15.0"
    min_kubernetes: "1.32"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "0.16.0"
    chart_version: "0.16.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.16.0"
    min_kubernetes: "1.32"
    breaking_changes:
      - description: >
          The ExternalSecret, ClusterExternalSecret, SecretStore and ClusterSecretStore CRDs serve
          v1 and drop v1alpha1
        type: api_removal
    risk_level: high
    upgrade_notes: >
      Before upgrading, move every manifest off v1alpha1 and remove v1alpha1 from the four CRDs'
      status.storedVersions (the release notes give the kubectl commands). Kustomize installs should
      use 0.16.1, which improves that upgrade path.

  - app_version: "0.17.0"
    chart_version: "0.17.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.17.0"
    min_kubernetes: "1.33"
    breaking_changes:
      - description: "v1beta1 is no longer served: manifests must use v1"
        type: api_removal
    risk_level: high
    upgrade_notes: >
      Change every manifest from external-secrets.io/v1beta1 to v1 while on 0.16.2 (which serves v1),
      then upgrade.

  - app_version: "0.18.0"
    chart_version: "0.18.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.18.0"
    min_kubernetes: "1.33"
    breaking_changes:
      - description: "The AWS providers move to AWS SDK v2 (flagged as potentially breaking)"
        type: behaviour_change
      - description: >
          The 1Password SDK provider's GetSecretMap filters with extract, like 1Password Connect
        type: behaviour_change
    risk_level: medium
    upgrade_notes: "Test AWS and 1Password stores in a non-production cluster first."

  - app_version: "0.19.0"
    chart_version: "0.19.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.19.0"
    min_kubernetes: "1.33"
    breaking_changes:
      - description: >
          The CRDs are too large for client-side apply: install them with
          `kubectl apply --server-side`, or ServerSideApply=true in Argo CD
        type: crd_migration
      - description: "The STSSessionToken generator no longer accepts JWT authentication"
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Argo CD Applications that install External Secrets need the ServerSideApply=true sync option
      before this upgrade.

  - app_version: "0.20.1"
    chart_version: "0.20.1"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.20.1"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. The first 0.20 chart is 0.20.1 (0.20.0 and 0.20.1
      were tagged the same day).

  - app_version: "1.0.0"
    chart_version: "1.0.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v1.0.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "First 1.x release; no breaking change in the release notes."

  - app_version: "1.1.0"
    chart_version: "1.1.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v1.1.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes; the AWS providers drop AWS SDK v1."

  - app_version: "1.2.0"
    chart_version: "1.2.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v1.2.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes; stores can be marked deprecated (#5711)."

  - app_version: "1.3.1"
    chart_version: "1.3.1"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v1.3.1"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. 1.3.1 re-publishes 1.3.0, whose image publishing
      failed; the first 1.3 chart is 1.3.1.

  - app_version: "2.0.0"
    chart_version: "2.0.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.0.0"
    min_kubernetes: "1.34"
    breaking_changes:
      - description: "The unmaintained Alibaba and Device42 providers are removed"
        type: api_removal
    risk_level: medium
    upgrade_notes: "Move stores off the Alibaba and Device42 providers before upgrading."

  - app_version: "2.1.0"
    chart_version: "2.1.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.1.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.2.0"
    chart_version: "2.2.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.2.0"
    min_kubernetes: "1.34"
    breaking_changes:
      - description: >
          Flux OCIRepository sources of the chart need a layerSelector for the Helm chart content
          layer
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Flux users pulling the chart from oci://ghcr.io/external-secrets/charts: add
      layerSelector.mediaType application/vnd.cncf.helm.chart.content.v1.tar+gzip with operation
      extract.

  - app_version: "2.3.0"
    chart_version: "2.3.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.3.0"
    min_kubernetes: "1.34"
    breaking_changes:
      - description: "The getHostByName template function is removed (#6164)"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: "Templates that call getHostByName fail to render; remove the call before upgrading."

  - app_version: "2.4.0"
    chart_version: "2.4.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.4.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.5.0"
    chart_version: "2.5.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.5.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. With scopedRBAC the chart defaults scopedNamespace to
      the release namespace.

  - app_version: "2.6.0"
    chart_version: "2.6.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.6.0"
    min_kubernetes: "1.34"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.7.0"
    chart_version: "2.7.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.7.0"
    min_kubernetes: "1.35"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.8.0"
    chart_version: "2.8.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.8.0"
    min_kubernetes: "1.35"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.9.0"
    chart_version: "2.9.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.9.0"
    min_kubernetes: "1.36"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      No breaking change in the release notes. Optional ExternalSecret strategy fields are no longer
      defaulted by the API (#6798), which can show up as a diff in GitOps tools.

  - app_version: "2.10.0"
    chart_version: "2.10.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.10.0"
    min_kubernetes: "1.36"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."

  - app_version: "2.11.0"
    chart_version: "2.11.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v2.11.0"
    min_kubernetes: "1.36"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "No breaking change in the release notes."
