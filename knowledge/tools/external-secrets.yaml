# Knowledge base entry for external-secrets (External Secrets Operator).
#
# Schema v2 (planner.Load rejects a file that breaks it; see internal/planner/matrix.go):
#   tool: string                 — canonical tool name (lowercase letters, digits, '-'); file is <tool>.yaml
#   aliases: [string]            — optional; other names scanners report for this tool, such as
#                                  Helm chart names. A name belongs to one tool only.
#   detection:                   — optional; how to find a raw `kubectl apply` install
#     deployments[]: name, namespace_hint, container, image_contains, version_from
#     labels: {string: string}
#   versions[]:                  — ascending by app_version, no duplicates
#     app_version: string        — upstream app version, full semver without "v" ("1.14.0").
#                                  The entry also covers later patches of its minor, up to the next entry.
#     chart_version: string      — Helm chart version that ships app_version, as published; ascending
#     source: string             — release-notes URL for this version
#     min_kubernetes: string     — earliest Kubernetes minor this version supports
#     incompatible_with:         — optional; tool name or alias → app versions of that tool
#       <tool>: [string]           known to break with this version
#     breaking_changes[]:        — may be empty
#       description: string      — human-readable summary
#       type: string             — api_removal | crd_migration | config_change | behaviour_change
#     risk_level: string         — low | medium | high | blocking: risk of upgrading to this version
#     upgrade_notes: string      — operator guidance for the upgrade from the previous entry

tool: external-secrets

versions:
  - app_version: "0.8.0"
    chart_version: "0.8.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.8.0"
    min_kubernetes: "1.19"
    incompatible_with:
      cert-manager:
        - "1.14"   # ExternalSecret status condition schema changed; causes watch errors
      vault: []
    breaking_changes:
      - description: "ExternalSecret v1alpha1 API version removed; v1beta1 is now the minimum"
        type: api_removal
      - description: "SecretStore .spec.provider field restructured; inline provider config no longer accepted"
        type: config_change
      - description: "ClusterSecretStore finalizer name changed; old finalizers must be removed manually before upgrade"
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      Migrate all ExternalSecret resources from v1alpha1 to v1beta1 before upgrading.
      Remove stale ClusterSecretStore finalizers with
      `kubectl patch clustersecretstore <name> -p '{"metadata":{"finalizers":[]}}' --type=merge`.
      Validate SecretStore provider configs match the new nested structure.

  - app_version: "0.9.0"
    chart_version: "0.9.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.9.0"
    min_kubernetes: "1.19"
    incompatible_with:
      cert-manager:
        - "1.15"   # PushSecret webhook validation rejects cert-manager-owned secrets
        - "1.15.1"
      vault: []
    breaking_changes:
      - description: "SecretStore API store reference field renamed from storeRef to secretStoreRef across all resources"
        type: api_removal
      - description: "PushSecret resource introduced as GA; experimental PushSecret alpha CRD must be removed before upgrade"
        type: crd_migration
      - description: "ESO controller flag --store-error-condition renamed to --secret-store-error-conditions"
        type: config_change
    risk_level: high
    upgrade_notes: >
      Patch all ExternalSecret and ClusterExternalSecret manifests to rename .spec.storeRef
      to .spec.secretStoreRef before applying. Remove the alpha PushSecret CRD if installed:
      `kubectl delete crd pushsecrets.external-secrets.io`. Re-install to pick up the GA CRD.
      Update operator Deployment args to replace --store-error-condition.

  - app_version: "0.9.5"
    chart_version: "0.9.5"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.9.5"
    min_kubernetes: "1.19"
    incompatible_with:
      cert-manager: []
      vault: []
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      Patch release. No breaking changes from 0.9.x. Review the changelog for bug fixes
      to webhook validation that may change previously-accepted invalid resources.

  - app_version: "0.10.0"
    chart_version: "0.10.0"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.10.0"
    min_kubernetes: "1.22"
    incompatible_with:
      cert-manager:
        - "1.12"   # cert-manager 1.12 ClusterIssuer annotation conflicts with ESO 0.10 ownership labels
      vault:
        - "1.13.1"  # Vault chart 0.24.0: agent injector sidecar conflicts with ESO token refresh on Kubernetes auth
    breaking_changes:
      - description: "ClusterSecretStore .spec.conditions field removed; replace with .spec.namespaceSelector"
        type: api_removal
      - description: "Kubernetes 1.19, 1.20, 1.21 support dropped"
        type: behaviour_change
      - description: "ESO webhook now enforces immutable .spec.refreshInterval; changes require resource recreation"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Requires Kubernetes >= 1.22. Migrate ClusterSecretStore manifests to replace
      .spec.conditions with .spec.namespaceSelector before upgrading.
      Audit all ExternalSecret resources for .spec.refreshInterval mutations — recreate
      any that changed this field after initial creation.
      Upgrade the Vault Helm chart to >= 0.25.0 (Vault 1.14.0) before deploying this ESO version.

  - app_version: "0.10.5"
    chart_version: "0.10.5"
    source: "https://github.com/external-secrets/external-secrets/releases/tag/v0.10.5"
    min_kubernetes: "1.22"
    incompatible_with:
      cert-manager: []
      vault: []
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      Patch release on the 0.10.x line. No breaking changes from 0.10.x.
      Contains fixes for ClusterSecretStore namespace selector edge cases introduced in 0.10.0.
