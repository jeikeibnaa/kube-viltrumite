# Knowledge base entry for HashiCorp Vault.
#
# Schema v2 (planner.Load rejects a file that breaks it; see internal/planner/matrix.go):
#   tool: string                 — canonical tool name (lowercase letters, digits, '-'); file is <tool>.yaml
#   aliases: [string]            — optional; other names scanners report for this tool, such as
#                                  Helm chart names. A name belongs to one tool only.
#   alias_origins:               — optional; for an alias too generic to trust alone: words, one of
#     <alias>: [string]            which the chart's origin (Helm home/sources, Argo CD repoURL, Flux
#                                  source name) must contain for the alias to count
#   detection:                   — optional; how to find a raw `kubectl apply` install
#     deployments[]:             — a Deployment, StatefulSet or DaemonSet matches by name or image
#       name: string             — workload name
#       image: string            — image repository, matched as a whole path suffix ("istio/pilot")
#       container: string        — container to read the version from after a name-only match
#       namespace_hint: string   — namespace the tool usually runs in (informational)
#       version_from: string     — image_tag | label (app.kubernetes.io/version)
#     labels: {string: string}
#   versions[]:                  — ascending by app_version, no duplicates
#     app_version: string        — upstream app version, full semver without "v" ("1.14.0"): the minor's
#                                  first release, or the patch upstream says to install instead.
#                                  The entry also covers later patches of its minor, up to the next entry.
#     chart_version: string      — Helm chart version that ships app_version, as published; ascending
#     source: string             — upstream release notes or upgrade guide the entry is based on
#     min_kubernetes: string     — earliest Kubernetes minor upstream supports or tests this version on,
#                                  never below the Helm chart's kubeVersion floor
#     incompatible_with:         — optional; tool name or alias → app versions of that tool known to
#       <tool>: [string]           break with this version, only with an upstream source
#     breaking_changes[]:        — changes since the previous entry that need attention; may be empty
#       description: string      — human-readable summary
#       type: string             — api_removal | crd_migration | config_change | behaviour_change
#     risk_level: string         — risk of upgrading to this version: low (nothing to do for a default
#                                  install) | medium (a documented step or config review for some
#                                  installs) | high (running workloads, traffic, keys or stored objects
#                                  break if the steps are missed) | blocking (do not install)
#     upgrade_notes: string      — operator guidance for the upgrade from the previous entry
#
# The entries describe the vault-helm chart releases that change the default Vault version, so
# app_version is the chart's appVersion (Vault ships patch releases through the chart, not always its
# x.y.0) and source links the chart's release notes. Breaking changes combine the chart's CHANGELOG
# with Vault's upgrade guides and "important changes" pages
# (https://developer.hashicorp.com/vault/docs/updates/important-changes). Verified 2026-09-30 against
# those and the chart index https://helm.releases.hashicorp.com. min_kubernetes is the earliest
# Kubernetes version the chart release was tested with (its kubeVersion floor is ">= 1.20.0-0" from
# 0.25.0, ">= 1.22.0-0" in 0.24.x).

tool: vault

detection:
  deployments:
    - name: vault
      namespace_hint: vault
      container: vault
      image: hashicorp/vault
      version_from: image_tag
    - image: hashicorp/vault-enterprise
      namespace_hint: vault
      version_from: image_tag

versions:
  - app_version: "1.13.1"
    chart_version: "0.24.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.24.0"
    min_kubernetes: "1.22"
    breaking_changes:
      - description: >
          Mounts backed by removed builtin plugins (standalone database engines, AppId auth) shut the
          Vault core down on unseal
        type: api_removal
      - description: "User lockout is on by default (5 failed logins lock a user for 15 minutes)"
        type: behaviour_change
      - description: "AliCloud auth login requires the role parameter"
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Disable mounts of removed builtin plugins before upgrading, or Vault shuts down on unseal. The
      Active Directory secrets engine is deprecated.

  - app_version: "1.14.0"
    chart_version: "0.25.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.25.0"
    min_kubernetes: "1.22"
    breaking_changes:
      - description: "The headless Service always sets publishNotReadyAddresses: true"
        type: behaviour_change
      - description: >
          The Docker Official Image vault is no longer updated; only hashicorp/vault gets new
          releases
        type: config_change
    risk_level: low
    upgrade_notes: >
      If server.image.repository was overridden to the official vault image, switch to
      hashicorp/vault. The chart's kubeVersion floor drops back to 1.20; upstream still tests from 1.22.

  - app_version: "1.15.1"
    chart_version: "0.26.1"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.26.1"
    min_kubernetes: "1.24"
    breaking_changes:
      - description: "Consul service registration tags are case-sensitive"
        type: behaviour_change
      - description: >
          Rollback metrics no longer include the mount point in their name unless
          add_mount_point_rollback_metrics is set
        type: behaviour_change
    risk_level: low
    upgrade_notes: >
      Use chart 0.26.1: 0.26.0 ignored server.ha.replicas from values files and always deployed 3
      replicas. Update dashboards that use mount-specific rollback metrics.

  - app_version: "1.15.2"
    chart_version: "0.27.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.27.0"
    min_kubernetes: "1.24"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "Patch release of Vault with no breaking change; the chart adds PVC retention and labels."

  - app_version: "1.16.1"
    chart_version: "0.28.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.28.0"
    min_kubernetes: "1.25"
    breaking_changes:
      - description: >
          LDAP auth uses userattr as the entity alias instead of <cn>@<upndomain>, which can change
          the policies attached to tokens
        type: behaviour_change
      - description: >
          LDAP auth logins need a userdn scoped to the organizational unit the user is in
        type: config_change
      - description: "Plugin environment variables take precedence over Vault's for external plugins"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      LDAP auth users: check the entity aliases and userdn before upgrading (see Vault's 1.16 upgrade
      guide for the opt-out). From 1.16.7 the Docker image no longer contains curl.

  - app_version: "1.17.2"
    chart_version: "0.28.1"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.28.1"
    min_kubernetes: "1.26"
    breaking_changes:
      - description: >
          JWT auth roles need bound_audiences when the JWT has an aud claim, and it must match one
        type: config_change
      - description: "Audit logs always include a predefined set of request headers"
        type: behaviour_change
      - description: "PKI sign-intermediate truncates notAfter to the signing issuer's notAfter"
        type: behaviour_change
      - description: "The injector's mutating webhook no longer intercepts UPDATE requests"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Set bound_audiences on JWT auth roles before upgrading, or their logins fail. The experimental
      request limiter is deprecated in favour of adaptive overload protection.

  - app_version: "1.18.1"
    chart_version: "0.29.1"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.29.1"
    min_kubernetes: "1.27"
    breaking_changes:
      - description: "The experimental request_limiter configuration is removed"
        type: config_change
      - description: "The Docker image no longer contains curl"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Use chart 0.29.1: 0.29.0 broke templated server config (GH-1072). Replace probes, hooks or
      scripts that run curl inside the Vault container.

  - app_version: "1.19.0"
    chart_version: "0.30.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.30.0"
    min_kubernetes: "1.28"
    breaking_changes:
      - description: >
          LDAP user DN searches with upndomain fail when they return more than one result (they used
          the last one)
        type: behaviour_change
      - description: "RADIUS authentication is no longer case sensitive"
        type: behaviour_change
      - description: "From 1.19.6, cancelling a rekey requires the rekey nonce"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Make LDAP DN searches with upndomain return a single user before upgrading. Automated rotation
      could stop after unseal on 1.19.0–1.19.2 (fixed in 1.19.3).

  - app_version: "1.20.1"
    chart_version: "0.30.1"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.30.1"
    min_kubernetes: "1.29"
    breaking_changes:
      - description: >
          Integrated storage requires an explicit disable_mlock setting (the chart already adds
          disable_mlock = true)
        type: config_change
      - description: "Azure auth roles need a bound group or service principal ID"
        type: config_change
      - description: >
          File audit devices need explicit prefix configuration and cannot use executable file
          permissions (CVE-2025-6000)
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Set disable_mlock explicitly in raw or custom server configs that use integrated storage.
      Bind Azure auth roles to a group or service principal before upgrading.

  - app_version: "1.20.4"
    chart_version: "0.31.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.31.0"
    min_kubernetes: "1.29"
    breaking_changes:
      - description: >
          csi.daemonSet.providersDir defaults to /var/run/secrets-store-csi-providers
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Vault CSI provider users: make providersDir match the Secrets Store CSI driver's providers
      directory, or set it back explicitly.

  - app_version: "1.21.2"
    chart_version: "0.32.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.32.0"
    min_kubernetes: "1.31"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      Vault 1.21 lists no breaking changes. The chart adds OpenShift service-ca automation and
      declarative volumeClaimTemplates parameters.

  - app_version: "2.0.2"
    chart_version: "0.33.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.33.0"
    min_kubernetes: "1.32"
    breaking_changes:
      - description: >
          sys/rekey, sys/generate-root and DR generate-operation-token need a Vault token as well as
          key shares
        type: behaviour_change
      - description: "Azure auth prefers auth/azure/config over AZURE_* environment variables"
        type: behaviour_change
      - description: >
          Enterprise: LDAP static roles keep their rotation schedule after a manual rotation
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      Major version: read Vault 2.0's important changes. Give rekey and generate-root callers a
      token before upgrading. Authentication headers above 8 KB are rejected with HTTP 431.

  - app_version: "2.0.3"
    chart_version: "0.34.0"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.34.0"
    min_kubernetes: "1.32"
    breaking_changes: []
    risk_level: low
    upgrade_notes: "Patch release of Vault 2.0; the chart adds Gateway API HTTPRoute support."

  - app_version: "2.0.4"
    chart_version: "0.34.1"
    source: "https://github.com/hashicorp/vault-helm/releases/tag/v0.34.1"
    min_kubernetes: "1.32"
    breaking_changes: []
    risk_level: low
    upgrade_notes: >
      Patch release of Vault 2.0; the license Secret volume's defaultMode is rendered in decimal.
