  - app_version: "0.94.0"
    chart_version: "91.0.0"
    source: "https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/UPGRADE.md#from-90x-to-91x"
    min_kubernetes: "1.25"
    breaking_changes:
      - description: "Prometheus Operator v0.94.0 CRDs must be applied before the upgrade"
        type: crd_migration
      - description: "Chart 89: the Grafana Helm sub-chart moves to v13.0.0"
        type: config_change
      - description: >
          Chart 90: control-plane ServiceMonitors authenticate with a token Secret the chart creates
          (prometheus.serviceAccount.createTokenSecret) instead of bearerTokenFile and caFile
        type: behaviour_change
      - description: "Chart 91: the operator's ClusterRole no longer grants wildcard verbs"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      With prometheus.prometheusSpec.ignoreNamespaceSelectors, supply your own token Secret in
      kube-system (default for kube-apiserver): the chart-created one is in the release namespace,
      where those ServiceMonitors cannot use it. The chart's token Secret is long-lived. With
      prometheus.enabled false (an operator-only install) chart 90+ refuses to render until the
      control-plane ServiceMonitors are disabled or given their own authorization.
