# Knowledge base entry for cert-manager.
#
# Schema v2 (planner.Load rejects a file that breaks it; see internal/planner/matrix.go):
#   tool: string                 — canonical tool name (lowercase letters, digits, '-'); file is <tool>.yaml
#   aliases: [string]            — optional; other names scanners report for this tool, such as
#                                  Helm chart names. A name belongs to one tool only.
#   detection:                   — optional; how to find a raw `kubectl apply` install
#     deployments[]: name, namespace_hint, container, image_contains, version_from
#     labels: {string: string}
#   versions[]:                  — ascending by app_version, no duplicates
#     app_version: string        — upstream app version, full semver without "v" ("1.14.0").
#                                  The entry also covers later patches of its minor, up to the next entry.
#     chart_version: string      — Helm chart version that ships app_version, as published; ascending
#     source: string             — release-notes URL for this version
#     min_kubernetes: string     — earliest Kubernetes minor this version supports
#     incompatible_with:         — optional; tool name or alias → app versions of that tool
#       <tool>: [string]           known to break with this version
#     breaking_changes[]:        — may be empty
#       description: string      — human-readable summary
#       type: string             — api_removal | crd_migration | config_change | behaviour_change
#     risk_level: string         — low | medium | high | blocking: risk of upgrading to this version
#     upgrade_notes: string      — operator guidance for the upgrade from the previous entry

tool: cert-manager

detection:
  deployments:
    - name: cert-manager
      namespace_hint: cert-manager
      container: cert-manager-controller
      image_contains: "cert-manager-controller"
      version_from: image_tag
  labels:
    app.kubernetes.io/name: cert-manager

versions:
  - app_version: "1.12.0"
    chart_version: "v1.12.0"
    source: "https://github.com/cert-manager/cert-manager/releases/tag/v1.12.0"
    min_kubernetes: "1.22"
    incompatible_with:
      external-secrets: []
    breaking_changes:
      - description: "cert-manager.io/v1alpha2 and v1alpha3 API versions removed from CRDs"
        type: api_removal
      - description: "cmctl CLI flag --kubeconfig-context renamed to --context"
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Run `cmctl upgrade migrate-api-version` before upgrading from 1.11 to convert
      any remaining v1alpha2/v1alpha3 resources to v1. Validate webhook connectivity
      with ingress-nginx >= 1.4.0.

  - app_version: "1.13.0"
    chart_version: "v1.13.0"
    source: "https://github.com/cert-manager/cert-manager/releases/tag/v1.13.0"
    min_kubernetes: "1.23"
    incompatible_with:
      external-secrets:
        - "0.7.0"   # ESO ClusterSecretStore CRD field conflict introduced in this release
        - "0.7.1"
    breaking_changes:
      - description: "Kubernetes 1.22 support dropped"
        type: behaviour_change
      - description: "Removed --acme-http01-solver-nameservers flag (use --dns01-recursive-nameservers)"
        type: config_change
    risk_level: low
    upgrade_notes: >
      Verify cluster is running Kubernetes >= 1.23 before upgrading.
      Replace --acme-http01-solver-nameservers in operator args with
      --dns01-recursive-nameservers if present. Avoid ingress-nginx 1.4.0, which has an
      IngressClass race condition with the cert-manager challenge solver.

  - app_version: "1.14.0"
    chart_version: "v1.14.0"
    source: "https://github.com/cert-manager/cert-manager/releases/tag/v1.14.0"
    min_kubernetes: "1.23"
    incompatible_with:
      external-secrets:
        - "0.8.0"   # ExternalSecret status condition schema changed; causes watch errors
    breaking_changes:
      - description: "Gateway API v1 (stable) required; experimental v1alpha2 route support removed"
        type: api_removal
      - description: "Certificate additionalOutputFormats field promoted to GA; alpha gate removed"
        type: config_change
    risk_level: low
    upgrade_notes: >
      If using Gateway API, upgrade gateway-api CRDs to v1.0+ before this cert-manager version.
      The feature gate --enable-gateway-api is now on by default; remove it from operator args
      to avoid deprecation warnings.

  - app_version: "1.15.0"
    chart_version: "v1.15.0"
    source: "https://github.com/cert-manager/cert-manager/releases/tag/v1.15.0"
    min_kubernetes: "1.25"
    incompatible_with:
      external-secrets:
        - "0.9.0"   # PushSecret webhook validation rejects cert-manager-owned secrets
        - "0.9.1"
    breaking_changes:
      - description: "Kubernetes 1.23 and 1.24 support dropped"
        type: behaviour_change
      - description: "Removed long-deprecated --controllers flag; use --enable-certificate-owner-ref"
        type: config_change
      - description: >
          CertificateRequest.spec.duration field now strictly validated;
          values below 1h are rejected
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      Requires Kubernetes >= 1.25. Audit all CertificateRequests for sub-1h duration values
      before upgrading — invalid resources will be rejected and may block issuance.
      Remove --controllers from operator Deployment args if present.
      Upgrade ingress-nginx to >= 1.10.0 and external-secrets to >= 0.9.2 first.
