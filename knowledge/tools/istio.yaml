# Knowledge base entry for Istio.
#
# Schema v2 (planner.Load rejects a file that breaks it; see internal/planner/matrix.go):
#   tool: string                 — canonical tool name (lowercase letters, digits, '-'); file is <tool>.yaml
#   aliases: [string]            — optional; other names scanners report for this tool, such as
#                                  Helm chart names. A name belongs to one tool only.
#   alias_origins:               — optional; for an alias too generic to trust alone: words, one of
#     <alias>: [string]            which the chart's origin (Helm home/sources, Argo CD repoURL, Flux
#                                  source name) must contain for the alias to count
#   detection:                   — optional; how to find a raw `kubectl apply` install
#     deployments[]:             — a Deployment, StatefulSet or DaemonSet matches by name or image
#       name: string             — workload name
#       image: string            — image repository, matched as a whole path suffix ("istio/pilot")
#       container: string        — container to read the version from after a name-only match
#       namespace_hint: string   — namespace the tool usually runs in (informational)
#       version_from: string     — image_tag | label (app.kubernetes.io/version)
#     labels: {string: string}
#   versions[]:                  — ascending by app_version, no duplicates
#     app_version: string        — upstream app version, full semver without "v" ("1.14.0"): the minor's
#                                  first release, or the patch upstream says to install instead.
#                                  The entry also covers later patches of its minor, up to the next entry.
#     chart_version: string      — Helm chart version that ships app_version, as published; ascending
#     source: string             — upstream release notes or upgrade guide the entry is based on
#     min_kubernetes: string     — earliest Kubernetes minor upstream supports or tests this version on,
#                                  never below the Helm chart's kubeVersion floor
#     incompatible_with:         — optional; tool name or alias → app versions of that tool known to
#       <tool>: [string]           break with this version, only with an upstream source
#     breaking_changes[]:        — changes since the previous entry that need attention; may be empty
#       description: string      — human-readable summary
#       type: string             — api_removal | crd_migration | config_change | behaviour_change
#     risk_level: string         — risk of upgrading to this version: low (nothing to do for a default
#                                  install) | medium (a documented step or config review for some
#                                  installs) | high (running workloads, traffic, keys or stored objects
#                                  break if the steps are missed) | blocking (do not install)
#     upgrade_notes: string      — operator guidance for the upgrade from the previous entry
#
# One entry per Istio minor, verified 2026-09-30 against its upgrade notes
# (https://istio.io/latest/news/releases/), the supported Kubernetes versions in istio.io's
# data/compatibility/supportStatus.yml, and the chart indexes (istio-release.storage.googleapis.com
# up to 1.30, https://blob.istio.io/istio-release/charts from 1.31). The base and istiod charts
# publish the Istio version as chart version and set no kubeVersion. Every entry assumes upstream's
# procedure: upgrade the control plane one minor at a time (canary upgrades may skip one), then
# restart injected workloads so their sidecars match.

tool: istio
aliases:
  - istiod
  - base
alias_origins:
  base: [istio]

detection:
  deployments:
    - name: istiod
      namespace_hint: istio-system
      container: discovery
      image: istio/pilot
      version_from: image_tag
    # The 1.30 charts default to the registry.istio.io/release hub (1.31 is back on docker.io/istio).
    - image: registry.istio.io/release/pilot
      namespace_hint: istio-system
      version_from: image_tag

versions:
  - app_version: "1.18.0"
    chart_version: "1.18.0"
    source: "https://istio.io/latest/news/releases/1.18.x/announcing-1.18/upgrade-notes/"
    min_kubernetes: "1.24"
    breaking_changes:
      - description: >
          Gateways derive their proxy concurrency from the CPU limit (or ProxyConfig.concurrency),
          as sidecars do, instead of using every core of the node
        type: behaviour_change
      - description: >
          Gateway API automated deployments are fully rendered Deployments that roll when their
          revision changes; the control plane must be on 1.16.5+ or 1.17.3+ first
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      To keep gateways on every core, set concurrency 0 in their proxy.istio.io/config annotation
      or remove their CPU limits.

  - app_version: "1.19.0"
    chart_version: "1.19.0"
    source: "https://istio.io/latest/news/releases/1.19.x/announcing-1.19/upgrade-notes/"
    min_kubernetes: "1.25"
    breaking_changes:
      - description: "EnvoyFilter must use canonical Envoy filter names"
        type: config_change
      - description: "EnvoyFilter extension injection must set typed_config; lookup by name alone is removed"
        type: config_change
      - description: >
          The base chart no longer ships istiod's ClusterRoles, Roles, bindings and ServiceAccount;
          the istiod chart owns them under new names
        type: config_change
      - description: 'Gateway API routes with a Service parentRef must set group: ""'
        type: config_change
    risk_level: medium
    upgrade_notes: >
      Run `istioctl analyze` for the EnvoyFilter deprecation warnings before upgrading, and fix
      Gateway API routes that attach to Services.

  - app_version: "1.20.0"
    chart_version: "1.20.0"
    source: "https://istio.io/latest/news/releases/1.20.x/announcing-1.20/upgrade-notes/"
    min_kubernetes: "1.25"
    breaking_changes:
      - description: >
          Envoy filters run in one order for inbound, outbound and gateway proxies; EnvoyFilters that
          relied on the old order can behave differently
        type: behaviour_change
      - description: "Sidecars get a startupProbe by default"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      ExternalName Services become aliases in 1.21; opt in early with ENABLE_EXTERNAL_NAME_ALIAS=true
      to find the VirtualServices and DestinationRules that need changes.

  - app_version: "1.21.0"
    chart_version: "1.21.0"
    source: "https://istio.io/latest/news/releases/1.21.x/announcing-1.21/upgrade-notes/"
    min_kubernetes: "1.26"
    breaking_changes:
      - description: >
          ENABLE_AUTO_SNI defaults to true: SNI is set from the HTTP host when a DestinationRule sets
          none
        type: behaviour_change
      - description: >
          VERIFY_CERT_AT_CLIENT defaults to true: server certificates are verified against the OS CAs
          when a DestinationRule sets no caCertificates
        type: behaviour_change
      - description: >
          ExternalName Services are aliases: VirtualServices routing to one need the referenced
          service to exist, and DestinationRules no longer apply to them
        type: behaviour_change
      - description: >
          Kubernetes Gateway deployments are labelled gateway.networking.k8s.io/gateway-name
          (istio.io/gateway-name is still added for now)
        type: config_change
    risk_level: high
    upgrade_notes: >
      Egress to services with private CAs fails once certificates are verified: set caCertificates
      or insecureSkipVerify in their DestinationRules, or install with compatibilityVersion=1.20
      while you adapt. ENABLE_EXTERNAL_NAME_ALIAS=false opts out of the ExternalName change.

  - app_version: "1.22.0"
    chart_version: "1.22.0"
    source: "https://istio.io/latest/news/releases/1.22.x/announcing-1.22/upgrade-notes/"
    min_kubernetes: "1.27"
    breaking_changes:
      - description: "Delta xDS is on by default"
        type: behaviour_change
      - description: "Traces are no longer sent to zipkin.istio-system.svc by default"
        type: behaviour_change
      - description: >
          ENHANCED_RESOURCE_SCOPING defaults to true: istiod processes only configuration within
          meshConfig.discoverySelectors
        type: behaviour_change
      - description: "ServiceEntry with resolution NONE respects targetPort"
        type: behaviour_change
      - description: "Ambient waypoints attach through the new namespace and service labels"
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      `istioctl x precheck --from-version=1.21` detects the tracing change; compatibilityVersion=1.21
      keeps the previous defaults. Set ISTIO_DELTA_XDS=false in proxies if delta xDS misbehaves.

  - app_version: "1.23.0"
    chart_version: "1.23.0"
    source: "https://istio.io/latest/news/releases/1.23.x/announcing-1.23/upgrade-notes/"
    min_kubernetes: "1.27"
    breaking_changes:
      - description: >
          The Go and protobuf APIs keep one version per type (the oldest); Go clients of
          istio.io/api or istio.io/client-go must update their imports
        type: api_removal
    risk_level: low
    upgrade_notes: >
      Kubernetes YAML is unaffected; only Go and protobuf consumers of the Istio APIs change.

  - app_version: "1.24.0"
    chart_version: "1.24.0"
    source: "https://istio.io/latest/news/releases/1.24.x/announcing-1.24/upgrade-notes/"
    min_kubernetes: "1.28"
    breaking_changes:
      - description: >
          Istio CRDs are templated in the base chart and upgraded with `helm upgrade` of the base
          release
        type: crd_migration
      - description: "The istiod-remote chart is replaced by the remote profile of the istiod chart"
        type: config_change
      - description: >
          Sidecar resources resolve service conflicts the same way as having no Sidecar resource
        type: behaviour_change
      - description: >
          Telemetry API CEL expressions must use standard Envoy attributes
          (filter_state.downstream_peer, xds.node)
        type: config_change
      - description: >
          Stricter gRPC ALPN validation breaks cert-manager's istio-csr up to v0.12.0
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      istio-csr users: run an istio-csr release with cert-manager/istio-csr#422, or set
      GRPC_ENFORCE_ALPN_ENABLED: "false" in meshConfig.defaultConfig.proxyMetadata. Ambient mode with
      DNS capture: upgrade istio-cni first, then restart the ambient workloads.

  - app_version: "1.25.0"
    chart_version: "1.25.0"
    source: "https://istio.io/latest/news/releases/1.25.x/announcing-1.25/upgrade-notes/"
    min_kubernetes: "1.29"
    breaking_changes:
      - description: "OpenCensus tracing is removed (Envoy dropped it); use OpenTelemetry"
        type: api_removal
      - description: "Ambient mode captures DNS by default (new pods)"
        type: behaviour_change
      - description: "DNS traffic respects the pod traffic exclusion annotations"
        type: behaviour_change
      - description: "ztunnel chart resources are named after .Resource.Name instead of ztunnel"
        type: config_change
    risk_level: medium
    upgrade_notes: >
      The bundled Grafana dashboards need Grafana 7.2 or later. Pods can opt out of ambient DNS
      capture with ambient.istio.io/dns-capture=false.

  - app_version: "1.26.0"
    chart_version: "1.26.0"
    source: "https://istio.io/latest/news/releases/1.26.x/announcing-1.26/upgrade-notes/"
    min_kubernetes: "1.29"
    breaking_changes:
      - description: >
          ztunnel chart resources are named ztunnel again by default (1.25 used .Resource.Name;
          override with resourceName)
        type: config_change
    risk_level: low
    upgrade_notes: >
      The Lightstep and OpenCensus telemetry providers are deprecated and removed in 1.27; move to
      the OpenTelemetry provider now.

  - app_version: "1.27.0"
    chart_version: "1.27.0"
    source: "https://istio.io/latest/news/releases/1.27.x/announcing-1.27/upgrade-notes/"
    min_kubernetes: "1.29"
    breaking_changes:
      - description: >
          Native sidecars are on by default: istio-proxy runs as an init container in eligible pods
        type: behaviour_change
      - description: "The Lightstep and OpenCensus telemetry providers are removed"
        type: api_removal
      - description: "The bundled Grafana dashboards must be regenerated (explicit dashboard UIDs)"
        type: config_change
    risk_level: high
    upgrade_notes: >
      Test mutating webhooks and controllers that modify the istio-proxy container: it is no longer a
      regular container.

  - app_version: "1.28.0"
    chart_version: "1.28.0"
    source: "https://istio.io/latest/news/releases/1.28.x/announcing-1.28/upgrade-notes/"
    min_kubernetes: "1.30"
    breaking_changes:
      - description: "InferencePool is v1 only; the alpha and release-candidate versions are removed"
        type: api_removal
      - description: "BackendTLSPolicy v1alpha3 is removed; only v1 is supported"
        type: api_removal
      - description: >
          METRIC_ROTATION_INTERVAL and METRIC_GRACEFUL_DELETION_INTERVAL are removed; use the
          sidecar.istio.io/statsEvictionInterval annotation
        type: config_change
    risk_level: medium
    upgrade_notes: >
      In ambient mode, old ztunnel images NACK the new PASSTHROUGH service type (ServiceEntries with
      resolution NONE) until they are upgraded.

  - app_version: "1.29.0"
    chart_version: "1.29.0"
    source: "https://istio.io/latest/news/releases/1.29.x/announcing-1.29/upgrade-notes/"
    min_kubernetes: "1.31"
    breaking_changes:
      - description: >
          Debug endpoint authorization is on: non-system namespaces get only config_dump, ndsz and
          edsz for proxies in their own namespace
        type: behaviour_change
      - description: >
          The Envoy metrics endpoint is compressed by default; the sidecar.istio.io/statsCompression
          annotation is removed (proxyConfig.statsCompression)
        type: config_change
      - description: "Circuit breaker remaining metrics are no longer tracked by default"
        type: behaviour_change
      - description: "Configuration duplicated in the base chart is removed (the istiod chart owns it)"
        type: config_change
      - description: "Ambient DNS capture and iptables reconciliation are on by default"
        type: behaviour_change
    risk_level: medium
    upgrade_notes: >
      Kiali and other tools that read debug endpoints from outside istio-system can lose access;
      ENABLE_DEBUG_ENDPOINT_AUTH=false restores it.

  - app_version: "1.30.0"
    chart_version: "1.30.0"
    source: "https://istio.io/latest/news/releases/1.30.x/announcing-1.30/upgrade-notes/"
    min_kubernetes: "1.32"
    breaking_changes:
      - description: >
          Gateway API CRDs must be v1.5.x: istiod reads TLSRoute and ReferenceGrant from the v1
          Standard channel, and older CRDs leave TLS passthrough listeners without routes
        type: crd_migration
      - description: "XDS debug endpoints on port 15010 require authentication"
        type: behaviour_change
      - description: >
          The CNI agent respects excludeNamespaces: ambient pods in excluded namespaces are
          un-enrolled
        type: behaviour_change
      - description: >
          For a hostname in several namespaces, sidecars prefer the Kubernetes Service, then the
          oldest other service
        type: behaviour_change
      - description: "CNI config files are written with 0600 permissions"
        type: behaviour_change
    risk_level: high
    upgrade_notes: >
      Install the Gateway API v1.5.x CRDs before upgrading
      (`kubectl apply -k "github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.5.1"`).
      istioctl --plaintext and custom plaintext XDS clients need ENABLE_DEBUG_ENDPOINT_AUTH=false.

  - app_version: "1.31.0"
    chart_version: "1.31.0"
    source: "https://istio.io/latest/news/releases/1.31.x/announcing-1.31/upgrade-notes/"
    min_kubernetes: "1.32"
    breaking_changes:
      - description: >
          Artifacts are no longer published to gcr.io/istio-release, registry.istio.io or
          istio-release.storage.googleapis.com: Helm charts move to
          https://blob.istio.io/istio-release/charts (OCI: ghcr.io/istio/release/charts)
        type: config_change
      - description: >
          Unhealthy endpoints are sent by default unless a Service sets
          OutlierDetection.minHealthPercent (PILOT_AUTO_SEND_UNHEALTHY_ENDPOINTS)
        type: behaviour_change
      - description: >
          Auto-registered WorkloadEntries need to re-register, or the networking.istio.io/tunnel=http
          label, to be reached over HBONE
        type: behaviour_change
      - description: "PILOT_SPAWN_UPSTREAM_SPAN_FOR_GATEWAY is removed"
        type: config_change
    risk_level: high
    upgrade_notes: >
      Point Helm repositories, Flux HelmRepositories and Argo CD sources at
      https://blob.istio.io/istio-release/charts: 1.31 charts are not in the old repository, and the
      GCP-hosted artifacts go away after scream tests from September to December 2026. Images stay on
      Docker Hub.
