              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CompatibilityPolicySpec defines the desired state of CompatibilityPolicy.
            properties:
              ai:
                description: AIProviderConfig configures the AI backend used for analysis.
                properties:
                  endpoint:
                    type: string
                  model:
                    type: string
                  provider:
                    enum:
                    - anthropic
                    - ollama
